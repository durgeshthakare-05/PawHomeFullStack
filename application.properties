server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pawhome?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-this-secret-key-at-least-32-characters-long}
app.jwt.expiration-ms=86400000
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
server.error.include-message=always
